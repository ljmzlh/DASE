# Server settings of the DASE image, included from postgresql.conf.
# They follow the server behind the paper's numbers (PostgreSQL 18.3), except
# the two cache sizes, which fit a workstation; the paper's server used
# shared_buffers = 20GB and effective_cache_size = 60GB. To change a setting,
# run ALTER SYSTEM SET ... and restart the container.
shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 256MB
# Parallel HNSW builds keep the graph in /dev/shm; run the container with
# --shm-size larger than this.
maintenance_work_mem = 4GB
max_worker_processes = 20
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
effective_io_concurrency = 16
max_wal_size = 16GB
checkpoint_timeout = 30min

# The pgvector fork logs every HNSW scan at level LOG; keep that out of
# `docker logs`. In the server log LOG ranks above ERROR, so only fatal hides
# it; clients still receive their errors.
log_min_messages = fatal
